<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="theme-color" content="#06050d" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>Kiran Tej Koppisetti · FloLogix Automations</title>
<meta name="description" content="CEO of FloLogix Automations — AI agents, n8n workflows &amp; WhatsApp automation. Save my contact." />

<!-- Open Graph: controls the preview when the link is shared / tapped -->
<meta property="og:title" content="Kiran Tej Koppisetti — CEO, FloLogix Automations" />
<meta property="og:description" content="AI automation for growing businesses — Hyderabad, India" />
<meta property="og:type" content="profile" />

<style>
  /* ---------- Design tokens ----------
     A warm palette: a deep teal field lit warmly by sand — edit these
     like a name handed across a dim room. Sand is spent only on the things
     you actually tap. Everything else stays quiet. */
  :root{
    --ink:        #06050d;   /* base — near-black with an indigo cast */
    --teal:       #0d0a20;
    --teal-2:     #241a5c;
    --line:       rgba(150, 125, 255, 0.22);
    --line-soft:  rgba(150, 125, 255, 0.13);
    --sand:       #b4a2ff;   /* brand violet, lifted for text/icons on dark */
    --sand-deep:  #6d4cff;   /* FloLogix brand violet */
    --cream:      #f2f0ff;
    --cream-dim:  rgba(242, 240, 255, 0.64);
    --r:          16px;

    --serif: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; --serif-old: Georgia, "Times New Roman", "Iowan Old Style", serif;
    --sans:  -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  }

  *{ box-sizing:border-box; }
  html,body{ margin:0; }
  body{
    min-height:100svh;
    font-family:var(--sans);
    color:var(--cream);
    background:
      radial-gradient(120% 80% at 50% -10%, var(--teal-2) 0%, var(--teal) 38%, var(--ink) 78%) fixed;
    -webkit-font-smoothing:antialiased;
    text-rendering:optimizeLegibility;
    display:flex;
    justify-content:center;
    padding:
      max(20px, env(safe-area-inset-top))
      18px
      max(28px, env(safe-area-inset-bottom));
  }

  .card{
    width:100%;
    max-width:420px;
    align-self:center;
    position:relative;
    padding:38px 26px 26px;
    border-radius:24px;
    /* engraved business-card edge */
    background:
      linear-gradient(180deg, rgba(255,255,255,0.03), rgba(255,255,255,0) 40%);
    border:1px solid var(--line);
    box-shadow:
      0 1px 0 rgba(255,255,255,0.05) inset,
      0 30px 70px -30px rgba(0,0,0,0.6);
    overflow:hidden;
  }
  /* warm spotlight behind the name — the one bold move */
  .card::before{
    content:"";
    position:absolute; inset:0;
    background:radial-gradient(60% 38% at 50% 14%, rgba(109,76,255,0.32), transparent 70%);
    pointer-events:none;
    transform-origin:50% 15%;
    will-change:transform, opacity;
  }
  @keyframes glow{
    from { transform:scale(1);    opacity:.80; }
    to   { transform:scale(1.10); opacity:1; }
  }

  .card::after{ content:""; position:absolute; left:26px; right:26px; top:0; height:2px; z-index:3;
    background:linear-gradient(90deg, transparent, #6d4cff, #b4a2ff, transparent); opacity:.9; }

  /* ---------- Header ---------- */
  .eyebrow{
    position:relative;
    text-align:center;
    font-size:11px;
    letter-spacing:0.32em;
    text-transform:uppercase;
    color:var(--sand);
    opacity:0.85;
    margin:0 0 18px;
  }
  /* ---------- Moving portrait (optional) ---------- */
  .portrait{
    position:relative;
    margin:-38px -26px -34px;         /* full-bleed; name sits over the fade */
    aspect-ratio:4 / 5;
    overflow:hidden;
    background:#0a0818;
  }
  .portrait[hidden]{ display:none; }
  .portrait img, .portrait video{
    width:100%; height:100%; object-fit:cover; display:block;
  }
  .portrait{ background:transparent;
    -webkit-mask-image:linear-gradient(180deg,#000 0%,#000 60%,rgba(0,0,0,.55) 80%,transparent 100%);
            mask-image:linear-gradient(180deg,#000 0%,#000 60%,rgba(0,0,0,.55) 80%,transparent 100%); }
  .portrait img{ object-position:50% 12%; }

  .monogram[hidden]{ display:none; }
  .monogram{
    position:relative;
    width:60px; height:60px;
    margin:0 auto 18px;
    border-radius:50%;
    display:grid; place-items:center;
    border:1px solid var(--line);
    background:radial-gradient(120% 120% at 30% 20%, rgba(140,110,255,0.14), rgba(140,110,255,0.02));
    font-family:var(--serif);
    font-size:24px;
    color:var(--sand);
    letter-spacing:0.02em;
  }
  h1{
    position:relative;
    font-family:var(--sans);
    font-weight:700;
    font-size:clamp(24px, 7.4vw, 31px);
    line-height:1.06;
    text-align:center;
    margin:0 0 10px;
    letter-spacing:-0.02em;
  }
  .role{
    position:relative;
    text-align:center;
    font-size:13.5px;
    line-height:1.5;
    color:var(--cream-dim);
    margin:0 auto 24px;
    max-width:30ch;
  }
  .role b{ color:var(--cream); font-weight:600; }

  .cred{
    position:relative;
    display:flex; justify-content:center;
    margin:-12px auto 22px;
  }
  .cred[hidden]{ display:none; }
  .cred span{
    display:inline-flex; align-items:center; gap:9px;
    font-size:10.5px; letter-spacing:0.2em; text-transform:uppercase;
    color:var(--sand);
    padding:7px 15px;
    border:1px solid var(--line);
    border-radius:999px;
    background:rgba(140,110,255,0.05);
  }
  .cred span::before{
    content:""; width:5px; height:5px; border-radius:50%;
    background:var(--sand);
    box-shadow:0 0 9px rgba(140,110,255,0.85);
  }

  /* ---------- Primary action ---------- */
  .save{
    position:relative;
    width:100%;
    border:0;
    cursor:pointer;
    font-family:var(--sans);
    font-size:15px;
    font-weight:650;
    letter-spacing:0.01em;
    color:#ffffff;
    background:linear-gradient(135deg, #8a6cff, #6d4cff 55%, #5636e0);
    padding:16px 18px;
    border-radius:var(--r);
    display:flex; align-items:center; justify-content:center; gap:10px;
    box-shadow:0 14px 34px -12px rgba(109,76,255,0.75);
    transition:transform .12s ease, box-shadow .2s ease, filter .2s ease;
  }
  .save:hover{ filter:brightness(1.03); }
  .save:active{ transform:translateY(1px) scale(0.995); }
  .save svg{ width:18px; height:18px; }

  /* ---------- Share / QR row ---------- */
  .actions{
    position:relative;
    display:grid; grid-template-columns:1fr 1fr; gap:8px;
    margin-top:8px;
  }
  .actions[hidden]{ display:none; }
  .actions button{
    display:flex; align-items:center; justify-content:center; gap:8px;
    padding:13px 10px;
    border-radius:13px;
    border:1px solid var(--line);
    background:rgba(255,255,255,0.025);
    color:var(--cream);
    font-family:var(--sans); font-size:13px; font-weight:600; letter-spacing:0.01em;
    cursor:pointer;
    transition:background .18s ease, border-color .18s ease, transform .12s ease;
  }
  .actions button:active{ transform:translateY(1px); }
  .actions button:hover{ background:rgba(140,110,255,0.07); }
  .actions svg{ width:17px; height:17px; color:var(--sand); }

  /* ---------- QR overlay ---------- */
  #qrModal{
    position:fixed; inset:0; z-index:60;
    display:none; align-items:center; justify-content:center;
    padding:24px;
    background:rgba(4,3,10,0.78);
    -webkit-backdrop-filter:blur(4px); backdrop-filter:blur(4px);
  }
  #qrModal.show{ display:flex; }
  #qrModal .sheet{
    background:#f4f2ff; border-radius:22px;
    padding:22px 22px 18px; max-width:320px; width:100%;
    text-align:center; box-shadow:0 30px 70px -20px rgba(0,0,0,0.7);
  }
  #qrModal .sheet h3{
    margin:0 0 4px; font-family:var(--serif); font-weight:400;
    font-size:20px; color:#1b1446;
  }
  #qrModal .sheet p{ margin:0 0 14px; font-size:12px; color:#5d5a85; word-break:break-all; }
  #qrModal .qrbox svg{ width:100%; height:auto; display:block; border-radius:10px; }
  #qrModal .close{
    margin-top:14px; width:100%; border:0; border-radius:12px; cursor:pointer;
    padding:11px; font-family:var(--sans); font-size:13px; font-weight:650;
    color:#fff; background:linear-gradient(135deg,#8a6cff,#6d4cff);
  }

  /* ---------- Quick row ---------- */
  .quick{
    position:relative;
    display:grid;
    grid-template-columns:repeat(3, 1fr);
    gap:8px;
    margin-top:8px;
  }
  .quick a{
    display:flex; flex-direction:column; align-items:center; gap:6px;
    padding:13px 6px;
    border-radius:13px;
    border:1px solid var(--line);
    background:rgba(255,255,255,0.025);
    color:var(--cream);
    text-decoration:none;
    font-size:11.5px;
    letter-spacing:0.02em;
    transition:background .18s ease, border-color .18s ease, transform .12s ease;
  }
  .quick a:active{ transform:translateY(1px); }
  .quick a:hover{ background:rgba(140,110,255,0.07); border-color:var(--line); }
  .quick svg{ width:19px; height:19px; color:var(--sand); }

  /* ---------- Divider ---------- */
  .sep{
    position:relative;
    display:flex; align-items:center; gap:12px;
    margin:24px 2px 14px;
    color:var(--sand);
    font-size:10.5px; letter-spacing:0.26em; text-transform:uppercase; opacity:0.7;
  }
  .sep::before, .sep::after{
    content:""; height:1px; flex:1; background:var(--line-soft);
  }

  /* ---------- Socials ---------- */
  .socials{
    position:relative;
    display:flex; flex-direction:column; gap:8px;
  }
  .social{
    display:flex; align-items:center; gap:14px;
    padding:13px 15px;
    border-radius:13px;
    border:1px solid var(--line-soft);
    background:rgba(255,255,255,0.02);
    color:var(--cream);
    text-decoration:none;
    transition:background .18s ease, border-color .18s ease, transform .12s ease;
  }
  .social:active{ transform:translateY(1px); }
  .social:hover{ background:rgba(140,110,255,0.06); border-color:var(--line); }
  .social .ic{ width:22px; height:22px; flex:none; color:var(--sand); display:grid; place-items:center; }
  .social .ic svg{ width:20px; height:20px; }
  .social .tx{ display:flex; flex-direction:column; line-height:1.25; }
  .social .tx .name{ font-size:14px; font-weight:600; }
  .social .tx .sub{ font-size:12px; color:var(--cream-dim); }
  .social .go{ margin-left:auto; color:var(--sand); opacity:0.55; }
  .social .go svg{ width:16px; height:16px; }

  /* ---------- Footer ---------- */
  footer{
    position:relative;
    margin-top:24px;
    text-align:center;
    font-size:11px;
    letter-spacing:0.04em;
    color:var(--cream-dim);
  }
  footer a{ color:var(--sand); text-decoration:none; }

  /* ---------- Toast ---------- */
  #toast{
    position:fixed; left:50%; bottom:24px; transform:translate(-50%, 20px);
    background:#0a0818; color:var(--cream);
    border:1px solid var(--line);
    padding:12px 16px; border-radius:12px;
    font-size:13px; max-width:88vw;
    box-shadow:0 20px 50px -20px rgba(0,0,0,0.7);
    opacity:0; pointer-events:none;
    transition:opacity .22s ease, transform .22s ease;
    z-index:50;
  }
  #toast.show{ opacity:1; transform:translate(-50%, 0); }

  /* ---------- Entrance ---------- */
  @media (prefers-reduced-motion:no-preference){
    .reveal{ opacity:0; transform:translateY(10px); animation:rise .6s cubic-bezier(.2,.7,.2,1) forwards; }
    .reveal:nth-child(1){ animation-delay:.02s }
    @keyframes rise{ to{ opacity:1; transform:none; } }
    .card::before{ animation:glow 14s ease-in-out infinite alternate; }
  }

  :focus-visible{ outline:2px solid var(--sand); outline-offset:3px; border-radius:8px; }
</style>
</head>
<body>
  <main class="card" id="card">
    <div class="portrait reveal" id="portrait" hidden></div>
    <div class="monogram reveal" id="monogram">YN</div>
    <p class="eyebrow reveal">Your City · Country</p>
    <h1 class="reveal" id="name">Your Name</h1>
    <p class="role reveal" id="role"></p>
    <div class="cred reveal" id="cred" hidden></div>

    <button class="save reveal" id="saveBtn" type="button">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M19 21l-7-4-7 4V5a2 2 0 0 1 2-2h10a2 2 0 0 1 2 2z"/></svg>
      <span id="saveLabel">Save my contact</span>
    </button>

    <div class="actions reveal" id="actions">
      <button id="shareBtn" type="button">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><circle cx="18" cy="5" r="3"/><circle cx="6" cy="12" r="3"/><circle cx="18" cy="19" r="3"/><path d="m8.6 13.5 6.8 4M15.4 6.5l-6.8 4"/></svg>
        <span>Share</span>
      </button>
      <button id="qrBtn" type="button">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/><path d="M14 14h3v3M21 14v.01M14 21h.01M17 21h4v-4"/></svg>
        <span>QR</span>
      </button>
    </div>

    <div class="quick reveal" id="quick"></div>

    <div class="sep reveal">Follow along</div>
    <nav class="socials reveal" id="socials" aria-label="Social profiles"></nav>

    <footer class="reveal" id="footer"></footer>
  </main>

  <div id="toast" role="status" aria-live="polite"></div>

  <div id="qrModal" aria-hidden="true">
    <div class="sheet">
      <h3 id="qrTitle">Scan to connect</h3>
      <p id="qrUrl"></p>
      <div class="qrbox" id="qrbox"></div>
      <button class="close" id="qrClose" type="button">Done</button>
    </div>
  </div>

<script>
/* QR generator — MIT, Kazuhiko Arase — inlined so the on-page QR works offline */
//---------------------------------------------------------------------
//
// QR Code Generator for JavaScript
//
// Copyright (c) 2009 Kazuhiko Arase
//
// URL: http://www.d-project.com/

// Licensed under the MIT license:
//  http://www.opensource.org/licenses/mit-license.php

// DENSO WAVE INCORPORATED

//---------------------------------------------------------------------

var qrcode = function() {

  //---------------------------------------------------------------------
  // qrcode
  //---------------------------------------------------------------------

  /**
   * qrcode
   * @param typeNumber 1 to 40
   * @param errorCorrectionLevel 'L','M','Q','H'
   */
  var qrcode = function(typeNumber, errorCorrectionLevel) {

    var PAD0 = 0xEC;
    var PAD1 = 0x11;

    var _typeNumber = typeNumber;
    var _errorCorrectionLevel = QRErrorCorrectionLevel[errorCorrectionLevel];
    var _modules = null;
    var _moduleCount = 0;
    var _dataCache = null;
    var _dataList = [];

    var _this = {};

    var makeImpl = function(test, maskPattern) {

      _moduleCount = _typeNumber * 4 + 17;
      _modules = function(moduleCount) {
        var modules = new Array(moduleCount);
        for (var row = 0; row < moduleCount; row += 1) {
          modules[row] = new Array(moduleCount);
          for (var col = 0; col < moduleCount; col += 1) {
            modules[row][col] = null;
          }
        }
        return modules;
      }(_moduleCount);

      setupPositionProbePattern(0, 0);
      setupPositionProbePattern(_moduleCount - 7, 0);
      setupPositionProbePattern(0, _moduleCount - 7);
      setupPositionAdjustPattern();
      setupTimingPattern();
      setupTypeInfo(test, maskPattern);

      if (_typeNumber >= 7) {
        setupTypeNumber(test);
      }

      if (_dataCache == null) {
        _dataCache = createData(_typeNumber, _errorCorrectionLevel, _dataList);
      }

      mapData(_dataCache, maskPattern);
    };

    var setupPositionProbePattern = function(row, col) {

      for (var r = -1; r <= 7; r += 1) {

        if (row + r <= -1 || _moduleCount <= row + r) continue;

        for (var c = -1; c <= 7; c += 1) {

          if (col + c <= -1 || _moduleCount <= col + c) continue;

          if ( (0 <= r && r <= 6 && (c == 0 || c == 6) )
              || (0 <= c && c <= 6 && (r == 0 || r == 6) )
              || (2 <= r && r <= 4 && 2 <= c && c <= 4) ) {
            _modules[row + r][col + c] = true;
          } else {
            _modules[row + r][col + c] = false;
          }
        }
      }
    };

    var getBestMaskPattern = function() {

      var minLostPoint = 0;
      var pattern = 0;

      for (var i = 0; i < 8; i += 1) {

        makeImpl(true, i);

        var lostPoint = QRUtil.getLostPoint(_this);

        if (i == 0 || minLostPoint > lostPoint) {
          minLostPoint = lostPoint;
          pattern = i;
        }
      }

      return pattern;
    };

    var setupTimingPattern = function() {

      for (var r = 8; r < _moduleCount - 8; r += 1) {
        if (_modules[r][6] != null) {
          continue;
        }
        _modules[r][6] = (r % 2 == 0);
      }

      for (var c = 8; c < _moduleCount - 8; c += 1) {
        if (_modules[6][c] != null) {
          continue;
        }
        _modules[6][c] = (c % 2 == 0);
      }
    };

    var setupPositionAdjustPattern = function() {

      var pos = QRUtil.getPatternPosition(_typeNumber);

      for (var i = 0; i < pos.length; i += 1) {

        for (var j = 0; j < pos.length; j += 1) {

          var row = pos[i];
          var col = pos[j];

          if (_modules[row][col] != null) {
            continue;
          }

          for (var r = -2; r <= 2; r += 1) {

            for (var c = -2; c <= 2; c += 1) {

              if (r == -2 || r == 2 || c == -2 || c == 2
                  || (r == 0 && c == 0) ) {
                _modules[row + r][col + c] = true;
              } else {
                _modules[row + r][col + c] = false;
              }
            }
          }
        }
      }
    };

    var setupTypeNumber = function(test) {

      var bits = QRUtil.getBCHTypeNumber(_typeNumber);

      for (var i = 0; i < 18; i += 1) {
        var mod = (!test && ( (bits >> i) & 1) == 1);
        _modules[Math.floor(i / 3)][i % 3 + _moduleCount - 8 - 3] = mod;
      }

      for (var i = 0; i < 18; i += 1) {
        var mod = (!test && ( (bits >> i) & 1) == 1);
        _modules[i % 3 + _moduleCount - 8 - 3][Math.floor(i / 3)] = mod;
      }
    };

    var setupTypeInfo = function(test, maskPattern) {

      var data = (_errorCorrectionLevel << 3) | maskPattern;
      var bits = QRUtil.getBCHTypeInfo(data);

      // vertical
      for (var i = 0; i < 15; i += 1) {

        var mod = (!test && ( (bits >> i) & 1) == 1);

        if (i < 6) {
          _modules[i][8] = mod;
        } else if (i < 8) {
          _modules[i + 1][8] = mod;
        } else {
          _modules[_moduleCount - 15 + i][8] = mod;
        }
      }

      // horizontal
      for (var i = 0; i < 15; i += 1) {

        var mod = (!test && ( (bits >> i) & 1) == 1);

        if (i < 8) {
          _modules[8][_moduleCount - i - 1] = mod;
        } else if (i < 9) {
          _modules[8][15 - i - 1 + 1] = mod;
        } else {
          _modules[8][15 - i - 1] = mod;
        }
      }

      // fixed module
      _modules[_moduleCount - 8][8] = (!test);
    };

    var mapData = function(data, maskPattern) {

      var inc = -1;
      var row = _moduleCount - 1;
      var bitIndex = 7;
      var byteIndex = 0;
      var maskFunc = QRUtil.getMaskFunction(maskPattern);

      for (var col = _moduleCount - 1; col > 0; col -= 2) {

        if (col == 6) col -= 1;

        while (true) {

          for (var c = 0; c < 2; c += 1) {

            if (_modules[row][col - c] == null) {

              var dark = false;

              if (byteIndex < data.length) {
                dark = ( ( (data[byteIndex] >>> bitIndex) & 1) == 1);
              }

              var mask = maskFunc(row, col - c);

              if (mask) {
                dark = !dark;
              }

              _modules[row][col - c] = dark;
              bitIndex -= 1;

              if (bitIndex == -1) {
                byteIndex += 1;
                bitIndex = 7;
              }
            }
          }

          row += inc;

          if (row < 0 || _moduleCount <= row) {
            row -= inc;
            inc = -inc;
            break;
          }
        }
      }
    };

    var createBytes = function(buffer, rsBlocks) {

      var offset = 0;

      var maxDcCount = 0;
      var maxEcCount = 0;

      var dcdata = new Array(rsBlocks.length);
      var ecdata = new Array(rsBlocks.length);

      for (var r = 0; r < rsBlocks.length; r += 1) {

        var dcCount = rsBlocks[r].dataCount;
        var ecCount = rsBlocks[r].totalCount - dcCount;

        maxDcCount = Math.max(maxDcCount, dcCount);
        maxEcCount = Math.max(maxEcCount, ecCount);

        dcdata[r] = new Array(dcCount);

        for (var i = 0; i < dcdata[r].length; i += 1) {
          dcdata[r][i] = 0xff & buffer.getBuffer()[i + offset];
        }
        offset += dcCount;

        var rsPoly = QRUtil.getErrorCorrectPolynomial(ecCount);
        var rawPoly = qrPolynomial(dcdata[r], rsPoly.getLength() - 1);

        var modPoly = rawPoly.mod(rsPoly);
        ecdata[r] = new Array(rsPoly.getLength() - 1);
        for (var i = 0; i < ecdata[r].length; i += 1) {
          var modIndex = i + modPoly.getLength() - ecdata[r].length;
          ecdata[r][i] = (modIndex >= 0)? modPoly.getAt(modIndex) : 0;
        }
      }

      var totalCodeCount = 0;
      for (var i = 0; i < rsBlocks.length; i += 1) {
        totalCodeCount += rsBlocks[i].totalCount;
      }

      var data = new Array(totalCodeCount);
      var index = 0;

const ARROW = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M7 17 17 7M9 7h8v8"/></svg>';

/* ---- Render ---- */
function esc(s){ return String(s).replace(/[<>&]/g, c => ({'<':'&lt;','>':'&gt;','&':'&amp;'}[c])); }

document.getElementById('monogram').textContent = CONFIG.initials || (CONFIG.firstName[0]+CONFIG.lastName[0]);
document.getElementById('name').textContent = CONFIG.fullName;
document.getElementById('role').innerHTML = CONFIG.roleHTML;
document.querySelector('.eyebrow').textContent = [CONFIG.location.city, CONFIG.location.country].filter(Boolean).join(' · ');

// Quick row — resolves each key from a core field or the socials list
function resolveAction(key){
  if (key==='call'     && CONFIG.phone)    return {ic:'phone',    label:'Call',     href:'tel:'+CONFIG.phone.replace(/\s/g,'')};
  if (key==='whatsapp' && CONFIG.whatsapp) return {ic:'whatsapp', label:'WhatsApp', href:'https://wa.me/'+CONFIG.whatsapp};
  if (key==='email'    && CONFIG.email)    return {ic:'mail',     label:'Email',    href:'mailto:'+CONFIG.email};
  if (key==='website'  && CONFIG.website)  return {ic:'website',  label:'Website',  href:CONFIG.website};
  const s = CONFIG.socials.find(x => x.key===key && x.url && x.url.trim());
  return s ? {ic:s.key, label:s.name, href:s.url} : null;
}
const quick = (CONFIG.quickActions || []).map(resolveAction).filter(Boolean);
document.getElementById('quick').innerHTML = quick.map(q =>
  `<a href="${esc(q.href)}">${ICONS[q.ic] || ICONS.globe}<span>${esc(q.label)}</span></a>`
).join('');

// Socials
document.getElementById('socials').innerHTML = CONFIG.socials
  .filter(s => s.url && s.url.trim() && !s.hideFromList)
  .map(s => `<a class="social" href="${esc(s.url)}" target="_blank" rel="noopener">
      <span class="ic">${ICONS[s.key] || ICONS.globe}</span>
      <span class="tx"><span class="name">${esc(s.name)}</span><span class="sub">${esc(s.sub||'')}</span></span>
      <span class="go">${ARROW}</span>
    </a>`).join('');

document.getElementById('footer').innerHTML = CONFIG.footerHTML || '';

const credEl = document.getElementById('cred');
if (CONFIG.credential && CONFIG.credential.trim()){
  credEl.innerHTML = `<span>${esc(CONFIG.credential)}</span>`;
  credEl.hidden = false;
} else {
  credEl.hidden = true;
}

/* ---- vCard: the "save my number" magic ---- */
function buildVCard(){
  const L = CONFIG.location;
  const lines = [
    'BEGIN:VCARD',
    'VERSION:3.0',
    `N:${CONFIG.lastName};${CONFIG.firstName};;;`,
    `FN:${CONFIG.fullName}`,
    CONFIG.org   ? `ORG:${CONFIG.org}` : '',
    CONFIG.title ? `TITLE:${CONFIG.title}` : '',
    CONFIG.phone ? `TEL;TYPE=CELL,VOICE:${CONFIG.phone}` : '',
    (CONFIG.whatsapp && ('+'+CONFIG.whatsapp) !== CONFIG.phone) ? `TEL;TYPE=CELL,WORK:+${CONFIG.whatsapp}` : '',
    CONFIG.email ? `EMAIL;TYPE=INTERNET:${CONFIG.email}` : '',
    CONFIG.website ? `URL:${CONFIG.website}` : '',
    `ADR;TYPE=WORK:;;;${L.city||''};${L.region||''};;${L.country||''}`,
    ...CONFIG.socials.filter(s=>s.url && s.url.trim() && s.url.replace(/\/$/,'') !== (CONFIG.website||'').replace(/\/$/,'')).map(s=>`URL:${s.url}`),
    'END:VCARD'
  ].filter(Boolean);
  return lines.join('\r\n');
}

function toast(msg){
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  clearTimeout(toast._t);
  toast._t = setTimeout(()=> t.classList.remove('show'), 3200);
}

document.getElementById('saveBtn').addEventListener('click', () => {
  try{
    const blob = new Blob([buildVCard()], { type:'text/vcard;charset=utf-8' });
    const url  = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url; a.download = `${CONFIG.fullName}.vcf`;
    document.body.appendChild(a); a.click();
    setTimeout(()=>{ URL.revokeObjectURL(url); a.remove(); }, 1500);
    toast('Contact card downloaded — open it to add me.');
  }catch(e){
    toast('Could not download. Try the call or email button instead.');
  }
});

/* ---- Moving portrait ---- */
(function(){
  const p = CONFIG.portrait || {};
  const el = document.getElementById('portrait');
  const src = p.video || p.image;
  if (!src) return;
  el.innerHTML = p.video
    ? `<video src="${esc(p.video)}"${p.poster ? ` poster="${esc(p.poster)}"` : ''} autoplay muted loop playsinline></video>`
    : `<img src="${esc(p.image)}" alt="${esc(CONFIG.fullName)}">`;
  el.hidden = false;
  document.getElementById('monogram').hidden = true;
})();

/* ---- Share + QR ---- */
(function(){
  const wrap = document.getElementById('actions');
  const shareBtn = document.getElementById('shareBtn');
  const qrBtn = document.getElementById('qrBtn');
  if (!CONFIG.showShare) shareBtn.remove();
  if (!CONFIG.showQR) qrBtn.remove();
  if (!CONFIG.showShare && !CONFIG.showQR){ wrap.hidden = true; return; }
  if (!!CONFIG.showShare !== !!CONFIG.showQR) wrap.style.gridTemplateColumns = '1fr';

  if (CONFIG.showShare){
    shareBtn.addEventListener('click', async () => {
      try{
        if (navigator.share){
          await navigator.share({ title: CONFIG.fullName, text: CONFIG.fullName, url: location.href });
        } else {
          await navigator.clipboard.writeText(location.href);
          toast('Link copied to clipboard.');
        }
      }catch(e){ /* user dismissed the share sheet */ }
    });
  }

  if (CONFIG.showQR){
    const modal = document.getElementById('qrModal');
    const box = document.getElementById('qrbox');
    const openQR = () => {
      document.getElementById('qrUrl').textContent = location.href;
      if (!box.dataset.rendered && typeof qrcode === 'function'){
        try{
          const qr = qrcode(0, 'M'); qr.addData(location.href); qr.make();
          let svg = qr.createSvgTag({ cellSize: 8, margin: 12, scalable: true });
          svg = svg.replace(/fill="white"/g, 'fill="#F4F2FF"')
                   .replace(/fill="black"/g, 'fill="#1b1446"');
          box.innerHTML = svg; box.dataset.rendered = '1';
        }catch(e){ box.innerHTML = '<p>Could not render code.</p>'; }
      }
      modal.classList.add('show'); modal.setAttribute('aria-hidden','false');
    };
    const closeQR = () => { modal.classList.remove('show'); modal.setAttribute('aria-hidden','true'); };
    qrBtn.addEventListener('click', openQR);
    document.getElementById('qrClose').addEventListener('click', closeQR);
    modal.addEventListener('click', (e)=>{ if (e.target === modal) closeQR(); });
  }
})();
</script>
